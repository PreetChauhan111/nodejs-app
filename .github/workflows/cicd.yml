name: CICD

on:
  push:
    branches:
      - deploy-to-ec2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v2

      - name: login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build docker image
        run: docker build -t preetchauhan/nodejs-app .

      - name: push docker image
        run: docker push preetchauhan/nodejs-app:latest
      
  deploy:
    needs: build
    runs-on: ["self-hosted", "linux", "aws-ec2"]

    steps:
      - name: pull docker image
        run: docker pull preetchauhan/nodejs-app:latest 
      
      - name: delete old docker container
        run: docker rm -f nodejs-app-container || true

      - name: run docker container
        run: docker run -d -p 5000:5000 -name nodejs-app-container:latest preetchauhan/nodejs-app